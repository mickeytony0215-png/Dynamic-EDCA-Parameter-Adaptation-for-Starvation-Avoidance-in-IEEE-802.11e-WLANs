#
# Dynamic (transient) load scenario — the regime where QAD-EDCA's runtime
# adaptation is supposed to beat a one-shot static tuning.
#
# Narrative being tested:
#   * Tuned Static permanently boosts AC_BE / AC_BK to ~AC_VI priority, so it
#     pays a *constant* VO/VI latency tax even when there is no starvation.
#   * Standard EDCA protects VO/VI but lets BE starve when high-priority load
#     surges.
#   * QAD-EDCA sits at defaults during calm phases (protecting VO/VI like
#     Standard) and only intervenes during the surge (rescuing BE like Tuned).
#   => QAD = Standard's calm-phase QoS + Tuned's surge-phase BE rescue, which
#      neither static configuration can achieve at once.
#
# Load profile (sim-time-limit = 60s, three 20 s phases):
#   [ 0,20) calm  : 1 VO + 1 VI active   (light high-priority load)
#   [20,40) surge : 4 VO + 4 VI active   (heavy high-priority load)
#   [40,60) calm  : 1 VO + 1 VI active   (recovery observation)
# The background is 4 saturated BE + 4 BK stations (same low-priority pressure
# as the headline 1VO/1VI/4BE/4BK steady config), so enough BE/BK traffic
# reaches the AP for its downlink BE queue to be the bottleneck the QAD detector
# watches. The high-priority surge then intensifies that AP-side starvation, so
# QAD's adaptation (AIFSN/CW) tracks the load while Standard lets BE collapse and
# Tuned Static pays a constant VO/VI tax.
#
# Implemented with per-station app start/stop gating (OMNeT++ module vectors are
# fixed at startup, so the "surge" stations exist the whole run but only send
# traffic in [20,40)).

# ============================================================
# Abstract base shared by the three schemes.
# ============================================================
[Config Dynamic_Base]
# (not run directly; the three concrete schemes below extend it)
extends = General
sim-time-limit = 60s
repeat = 10   # more reps -> smoother ensemble-averaged time series

# Fixed station pool. Only a subset of VO/VI is active outside the surge window.
*.numVoStations = 4
*.numViStations = 4
*.numBeStations = 4
*.numBkStations = 4

# Best-effort stays saturated (1500 B / 1 ms, inherited from General) so the
# AP's downlink BE queue is genuinely pressured — that is the signal the QAD
# detector monitors.

# --- Surge gating: voSta[0]/viSta[0] stay on the whole run; the rest only
#     transmit during the [20,40) surge window. ---
*.voSta[1..3].app[0].startTime = 20s
*.voSta[1..3].app[0].stopTime  = 40s
*.viSta[1..3].app[0].startTime = 20s
*.viSta[1..3].app[0].stopTime  = 40s

# --- Time-series recording (vectors). Recording every vector is ~2 GB/run, so
#     enable ONLY the handful the plots need. OMNeT++ matches these per-result
#     options first-match-wins through the section-fallback chain, so the
#     specific `:vector.vector-recording = true` lines (in this derived section)
#     are consulted before General's blanket `**.vector-recording = false`. ---
*.server.app[*].endToEndDelay:vector.vector-recording = true
*.server.app[*].throughput:vector.vector-recording = true
*.qadManager.starvationDetected:vector.vector-recording = true
*.qadManager.adjustedAifsnBe:vector.vector-recording = true
*.qadManager.adjustedAifsnBk:vector.vector-recording = true
*.qadManager.adjustedCwMinVo:vector.vector-recording = true
*.qadManager.adjustedCwMinVi:vector.vector-recording = true
**.vector-recording = false

# ============================================================
# Three schemes under the identical dynamic load.
# ============================================================
[Config Dynamic_Baseline]
description = "Standard EDCA under transient high-priority surge"
extends = Dynamic_Base

[Config Dynamic_TunedStatic]
description = "Tuned Static EDCA under transient high-priority surge"
extends = Dynamic_Base
# AC_BE -> AC_VI level, AC_BK -> AC_BE-old level (same as tuned_static.ini).
*.ap.wlan[*].mac.hcf.edca.edcaf[0].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[0].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 2

[Config Dynamic_QadEdca]
description = "QAD-EDCA under transient high-priority surge"
extends = Dynamic_Base
*.hasQadManager = true
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"
*.qadManager.monitorInterval = 100ms
*.qadManager.queueThreshold = 0.8
*.qadManager.lossThreshold = 0.1
*.qadManager.aifsStep = 1
*.qadManager.cwScaleFactor = 2.0
*.qadManager.txopScaleFactor = 0.75
*.qadManager.recoveryFactor = 0.3
