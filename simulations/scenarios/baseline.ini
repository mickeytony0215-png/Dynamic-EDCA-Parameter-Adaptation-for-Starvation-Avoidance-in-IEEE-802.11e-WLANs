#
# Baseline: Standard EDCA with fixed default parameters
# Demonstrates starvation under varying high-priority load
#

# Traffic mix corresponds to 3GPP TS 23.501 Table 5.7.4-1 5QI categories:
#   VO=5QI 1 (voice), VI=5QI 2 (conversational video),
#   BE=5QI 9 (default Non-GBR), BK=5QI 8 (Non-GBR background).
# Parallel iteration (`! numVo`) makes the 4 columns one configuration each,
# not 4x4x4x4 Cartesian — total = 4 configs × `repeat` repetitions.

[Config Baseline_N5]
description = "Standard EDCA, 5 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=0,1,1,2}
*.numViStations = ${numVi=1,1,2,2 ! numVo}
*.numBeStations = ${numBe=2,2,1,1 ! numVo}
*.numBkStations = ${numBk=2,1,1,0 ! numVo}

[Config Baseline_N10]
description = "Standard EDCA, 10 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=1,2,3,4}
*.numViStations = ${numVi=1,2,3,4 ! numVo}
*.numBeStations = ${numBe=4,3,2,1 ! numVo}
*.numBkStations = ${numBk=4,3,2,1 ! numVo}

[Config Baseline_N15]
description = "Standard EDCA, 15 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=1,3,4,6}
*.numViStations = ${numVi=2,3,5,6 ! numVo}
*.numBeStations = ${numBe=6,5,3,2 ! numVo}
*.numBkStations = ${numBk=6,4,3,1 ! numVo}

[Config Baseline_N20]
description = "Standard EDCA, 20 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=2,4,6,8}
*.numViStations = ${numVi=2,4,6,8 ! numVo}
*.numBeStations = ${numBe=8,6,4,2 ! numVo}
*.numBkStations = ${numBk=8,6,4,2 ! numVo}

# ============================================================
# Load sweep: fix N=10, vary BE send interval for load levels
# ============================================================
[Config Baseline_LoadSweep]
description = "Standard EDCA, N=10, varying network load"
extends = General
*.numVoStations = 2
*.numViStations = 2
*.numBeStations = 3
*.numBkStations = 3

# Load levels: light(10ms) / medium(3ms) / heavy(1ms) / saturated(0.3ms)
*.beSta[*].app[0].sendInterval = ${beInterval=10ms, 3ms, 1ms, 0.3ms}
