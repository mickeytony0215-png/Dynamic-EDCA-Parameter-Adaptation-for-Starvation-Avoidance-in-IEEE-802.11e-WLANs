#
# Tuned Static EDCA — manually shortened CWmin / AIFSN for AC_BE and AC_BK
# while keeping AC_VO / AC_VI at IEEE 802.11-2020 defaults.
#
# Purpose: ablation against QAD-EDCA. Tuned Static shows what a one-shot
# "starvation-aware" parameter tweak can achieve without runtime adaptation.
# If QAD-EDCA significantly outperforms it under varying loads, the dynamic
# adaptation is justified.
#
# Tuned values (only AC_BE / AC_BK; default values per IEEE 802.11-2020
# Table 9-155 for OFDM PHY, non-AP STA):
#     AC_BE (edcaf[1]):   CWmin 15 -> 7,  AIFSN 3 -> 2  (match AC_VI)
#     AC_BK (edcaf[0]):   CWmin 15 -> 7,  AIFSN 7 -> 3  (match AC_BE old)
# AC_VI / AC_VO stay at INET defaults (cwMin = -1 = use standard).
#
# Same VO/VI/BE/BK mixes as baseline.ini (parallel iteration via `! numVo`).

[Config TunedStatic_N5]
description = "Tuned Static EDCA, 5 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=0,1,1,2}
*.numViStations = ${numVi=1,1,2,2 ! numVo}
*.numBeStations = ${numBe=2,2,1,1 ! numVo}
*.numBkStations = ${numBk=2,1,1,0 ! numVo}
*.ap.wlan[*].mac.hcf.edca.edcaf[0].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[0].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 2

[Config TunedStatic_N10]
description = "Tuned Static EDCA, 10 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=1,2,3,4}
*.numViStations = ${numVi=1,2,3,4 ! numVo}
*.numBeStations = ${numBe=4,3,2,1 ! numVo}
*.numBkStations = ${numBk=4,3,2,1 ! numVo}
*.ap.wlan[*].mac.hcf.edca.edcaf[0].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[0].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 2

[Config TunedStatic_N15]
description = "Tuned Static EDCA, 15 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=1,3,4,6}
*.numViStations = ${numVi=2,3,5,6 ! numVo}
*.numBeStations = ${numBe=6,5,3,2 ! numVo}
*.numBkStations = ${numBk=6,4,3,1 ! numVo}
*.ap.wlan[*].mac.hcf.edca.edcaf[0].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[0].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 2

[Config TunedStatic_N20]
description = "Tuned Static EDCA, 20 STAs, varying VO/VI ratio"
extends = General
*.numVoStations = ${numVo=2,4,6,8}
*.numViStations = ${numVi=2,4,6,8 ! numVo}
*.numBeStations = ${numBe=8,6,4,2 ! numVo}
*.numBkStations = ${numBk=8,6,4,2 ! numVo}
*.ap.wlan[*].mac.hcf.edca.edcaf[0].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[0].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 2
