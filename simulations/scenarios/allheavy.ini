#
# All-heavy stress test: 4 VO + 4 VI + 4 BE + 4 BK, every AC heavily loaded
# at once (N=16). This is the one corner not covered by the N-mixes (which
# trade high-priority count against low-priority count). It is the scenario
# where Tuned Static's *permanent* BE/BK aggression is most likely to steal
# airtime from the now-also-heavy, delay-critical VO/VI — i.e. the best chance
# for QAD's "back off when not starving" to beat Tuned on VO/VI QoS.
#
# BE stays saturated (1 ms, from General). Three schemes, 5 reps each.

[Config AllHeavy_Standard]
description = "Standard EDCA, 4VO/4VI/4BE/4BK"
extends = General
*.numVoStations = 4
*.numViStations = 4
*.numBeStations = 4
*.numBkStations = 4

[Config AllHeavy_Tuned]
description = "Tuned Static EDCA, 4VO/4VI/4BE/4BK"
extends = AllHeavy_Standard
*.ap.wlan[*].mac.hcf.edca.edcaf[0].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[0].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 2

[Config AllHeavy_QadEdca]
description = "QAD-EDCA, 4VO/4VI/4BE/4BK"
extends = AllHeavy_Standard
*.hasQadManager = true
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"
*.qadManager.monitorInterval = 100ms
*.qadManager.queueThreshold = 0.8
*.qadManager.lossThreshold = 0.1
*.qadManager.cwScaleFactor = 2.0
*.qadManager.recoveryFactor = 0.3
