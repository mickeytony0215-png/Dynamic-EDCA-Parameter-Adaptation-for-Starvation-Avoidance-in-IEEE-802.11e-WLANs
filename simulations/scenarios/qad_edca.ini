#
# QAD-EDCA: Queue-Aware Dynamic EDCA parameter adaptation
# Mirrors baseline scenarios but with QAD-EDCA manager active
#

# Mirrors Baseline_N10/N20 mix; parallel iteration (`! numVo`) avoids Cartesian product.

[Config QadEdca_N10]
description = "QAD-EDCA, 10 STAs, varying VO/VI ratio"
extends = General
*.hasQadManager = true
*.numVoStations = ${numVo=1,2,3,4}
*.numViStations = ${numVi=1,2,3,4 ! numVo}
*.numBeStations = ${numBe=4,3,2,1 ! numVo}
*.numBkStations = ${numBk=4,3,2,1 ! numVo}

# Replace Hcf with QadHcf (which uses QadEdca → QadEdcaf → QadTxopProcedure)
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"

# QAD-EDCA Manager parameters (defaults from NED, override here if needed)
*.qadManager.monitorInterval = 100ms
*.qadManager.queueThreshold = 0.8
*.qadManager.lossThreshold = 0.1
*.qadManager.aifsStep = 1
*.qadManager.cwScaleFactor = 2.0
*.qadManager.txopScaleFactor = 0.75
*.qadManager.recoveryFactor = 0.3

[Config QadEdca_N20]
description = "QAD-EDCA, 20 STAs, varying VO/VI ratio"
extends = General
*.hasQadManager = true
*.numVoStations = ${numVo=2,4,6,8}
*.numViStations = ${numVi=2,4,6,8 ! numVo}
*.numBeStations = ${numBe=8,6,4,2 ! numVo}
*.numBkStations = ${numBk=8,6,4,2 ! numVo}

# Replace Hcf with QadHcf (which uses QadEdca → QadEdcaf → QadTxopProcedure)
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"

# QAD-EDCA Manager parameters
*.qadManager.monitorInterval = 100ms

[Config QadEdca_N5]
description = "QAD-EDCA, 5 STAs, varying VO/VI ratio"
extends = General
*.hasQadManager = true
*.numVoStations = ${numVo=0,1,1,2}
*.numViStations = ${numVi=1,1,2,2 ! numVo}
*.numBeStations = ${numBe=2,2,1,1 ! numVo}
*.numBkStations = ${numBk=2,1,1,0 ! numVo}
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"

[Config QadEdca_N15]
description = "QAD-EDCA, 15 STAs, varying VO/VI ratio"
extends = General
*.hasQadManager = true
*.numVoStations = ${numVo=1,3,4,6}
*.numViStations = ${numVi=2,3,5,6 ! numVo}
*.numBeStations = ${numBe=6,5,3,2 ! numVo}
*.numBkStations = ${numBk=6,4,3,1 ! numVo}
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"

# ============================================================
# Sensitivity sweeps — fixed N=10 heavy load (same condition as ThresholdSweep)
# so each sweep isolates one parameter while keeping others at default.
# ============================================================

[Config QadEdca_ThresholdSweep]
description = "QAD-EDCA threshold sensitivity, N=10, heavy load"
extends = General
*.hasQadManager = true
*.numVoStations = 3
*.numViStations = 3
*.numBeStations = 2
*.numBkStations = 2
*.beSta[*].app[0].sendInterval = 1ms
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"
*.qadManager.queueThreshold = ${qTh=0.5, 0.7, 0.8, 0.9}
*.qadManager.lossThreshold = ${pTh=0.05, 0.1, 0.15, 0.2}

[Config QadEdca_CwScaleSweep]
description = "Sensitivity: cwScaleFactor (CWmin multiplier for VO/VI)"
extends = General
*.hasQadManager = true
*.numVoStations = 3
*.numViStations = 3
*.numBeStations = 2
*.numBkStations = 2
*.beSta[*].app[0].sendInterval = 1ms
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"
*.qadManager.cwScaleFactor = ${cwScale=1.5, 2.0, 3.0, 4.0}

[Config QadEdca_RecoveryFactorSweep]
description = "Sensitivity: recoveryFactor (exponential recovery rate)"
extends = General
*.hasQadManager = true
*.numVoStations = 3
*.numViStations = 3
*.numBeStations = 2
*.numBkStations = 2
*.beSta[*].app[0].sendInterval = 1ms
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"
*.qadManager.recoveryFactor = ${recovery=0.1, 0.3, 0.5, 0.7}

[Config QadEdca_MonitorIntervalSweep]
description = "Sensitivity: monitorInterval (control loop period)"
extends = General
*.hasQadManager = true
*.numVoStations = 3
*.numViStations = 3
*.numBeStations = 2
*.numBkStations = 2
*.beSta[*].app[0].sendInterval = 1ms
*.ap.wlan[*].mac.hcf.typename = "edcafairness.src.QadHcf"
*.qadManager.monitorInterval = ${monInt=50ms, 100ms, 200ms, 500ms}
