#
# QCAAAE comparison baseline — Salem et al., IJCNC 2019 (DOI 10.5121/ijcnc.2019.11305).
# "QoS Categories Activeness-Aware Adaptive EDCA Algorithm for Dense IoT Networks."
#
# Faithful reproduction of QCAAAE's per-AC EDCA parameters (paper Eq.(1)(2) +
# Table 2 + Algorithm 1-2), applied at the AP. QCAAAE adapts to the number of
# associated STAs per AC (N_AC), which is STATIC in our steady configs, so the
# per-AC values are precomputed here (a "computed static" config):
#
#   CWmin[AC] = 2^ceil(log2(N_AC/2)) - 1          (clamped >= 1)
#   CWmax[AC] = min(2^ceil(log2(2*N_AC)) - 1, 1023)
#   AIFSN: VO & VI active -> VO=2, VI=3, BE=4      (Table 2; BK not tuned by QCAAAE)
#
# edcaf index mapping: edcaf[0]=AC_BK, [1]=AC_BE, [2]=AC_VI, [3]=AC_VO.
# BK is left at the IEEE default (QCAAAE only tunes VO/VI/BE).
# Uses the standard Hcf (no QAD manager); these are one-shot computed values.
#
# Result (BE throughput, 5 reps): QCAAAE ~= Tuned Static, both ~0.3-0.4 Mbps
# above QAD-EDCA at every mix -> a second independent static method confirming
# the feedback-control ceiling (see docs/final-presentation_zh.md sec 6-2).

[Config QCAAAE_N10_mix1]   # 1 VO / 1 VI / 4 BE / 4 BK
description = "QCAAAE, N=10, 1VO/1VI/4BE/4BK"
extends = General
*.numVoStations = 1
*.numViStations = 1
*.numBeStations = 4
*.numBkStations = 4
*.ap.wlan[*].mac.hcf.edca.edcaf[3].cwMin = 1
*.ap.wlan[*].mac.hcf.edca.edcaf[3].cwMax = 1
*.ap.wlan[*].mac.hcf.edca.edcaf[3].aifsn = 2
*.ap.wlan[*].mac.hcf.edca.edcaf[2].cwMin = 1
*.ap.wlan[*].mac.hcf.edca.edcaf[2].cwMax = 1
*.ap.wlan[*].mac.hcf.edca.edcaf[2].aifsn = 3
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMin = 1
*.ap.wlan[*].mac.hcf.edca.edcaf[1].cwMax = 7
*.ap.wlan[*].mac.hcf.edca.edcaf[1].aifsn = 4

