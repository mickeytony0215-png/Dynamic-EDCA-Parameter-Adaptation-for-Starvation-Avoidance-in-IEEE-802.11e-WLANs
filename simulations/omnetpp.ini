#
# EDCA Fairness Project - Master Configuration
# Common settings shared by all scenarios
#

[General]
network = EdcaFairnessNetwork
sim-time-limit = 30s
repeat = 5
seed-set = ${repetition}

# Recording
**.result-recording-modes = default
**.vector-recording = false   # 縮減批次：暫時關閉 .vec，需時間序列時改 true
outputvectormanager-class = "omnetpp::envir::SqliteOutputVectorManager"
outputscalarmanager-class = "omnetpp::envir::SqliteOutputScalarManager"

# Constraint area for mobility — 3GPP TR 38.901 Table 7.2-2 Indoor Hotspot (InH) / Indoor-office.
# Floor: 120 m x 50 m x 3 m. We use z=0 since INET ScalarRadioMedium is 2-D.
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 120m
**.constraintAreaMaxY = 50m
**.constraintAreaMaxZ = 0m

# Disable OSG visualizer (not compiled)
*.visualizer.osgVisualizer.typename = ""

# Radio settings
# 54 Mbps = maximum OFDM rate per IEEE 802.11-2020 Clause 17 Table 17-4
# (Modulation-dependent parameters), achieved via 64-QAM 3/4 coding.
# Slot time = 9 us, SIFS = 16 us (IEEE 802.11-2020 §17.3.8.6, Table 17-21).
*.*.wlan[*].bitrate = 54Mbps

# Enable QoS (EDCA) on all stations
*.*.wlan[*].mac.qosStation = true
*.*.wlan[*].classifier.typename = "QosClassifier"

# ============================================================
# Server: 4 UDP sinks for each AC
# ============================================================
*.server.numApps = 4
*.server.app[*].typename = "UdpSink"
*.server.app[0].localPort = 5000    # Voice
*.server.app[1].localPort = 4000    # Video
*.server.app[2].localPort = 80      # Best Effort
*.server.app[3].localPort = 21      # Background

# ============================================================
# Voice stations (AC_VO): G.711 VoIP, 64 kbps PCM
# Payload: 160 B / 20 ms (= 64 kbit/s)
#   - ITU-T G.711 (PCMU/PCMA codec, 8 kHz x 8 bit = 64 kbit/s).
#   - RFC 3551 §4.2 + Table 4: default ptime = 20 ms for PT 0 (PCMU) / PT 8 (PCMA).
#   - Arithmetic: 8000 samples/s x 8 bit x 0.02 s = 1280 bit = 160 B.
# QoS class: 3GPP TS 23.501 Table 5.7.4-1 5QI=1 Conversational Voice
#   (Resource: GBR, Default Priority 20, PDB 100 ms, PER 1e-2).
# ============================================================
*.voSta[*].numApps = 1
*.voSta[*].app[0].typename = "UdpBasicApp"
*.voSta[*].app[0].destAddresses = "server"
*.voSta[*].app[0].destPort = 5000
*.voSta[*].app[0].messageLength = 160B
*.voSta[*].app[0].sendInterval = 20ms
*.voSta[*].app[0].startTime = uniform(0s, 0.1s)
*.voSta[*].app[0].packetName = "voice"

# ============================================================
# Video stations (AC_VI): HD conversational video, ~1 Mbps
# Payload: 1280 B / 10 ms (= 1024 kbit/s)
#   - 3GPP TS 26.114 Annex A.4.7.2/A.4.7.4 (SDP example): 1280x720 H.264 @ 25 fps
#     ~= 950-1060 kbps including IP/UDP/RTP overhead.
#   - One slice per RTP packet, packet size < network MTU (§7.5.2.2).
# QoS class: 3GPP TS 23.501 Table 5.7.4-1 5QI=2 Conversational Video (Live Streaming)
#   (Resource: GBR, Default Priority 40, PDB 150 ms, PER 1e-3).
# ============================================================
*.viSta[*].numApps = 1
*.viSta[*].app[0].typename = "UdpBasicApp"
*.viSta[*].app[0].destAddresses = "server"
*.viSta[*].app[0].destPort = 4000
*.viSta[*].app[0].messageLength = 1280B
*.viSta[*].app[0].sendInterval = 10ms
*.viSta[*].app[0].startTime = uniform(0s, 0.1s)
*.viSta[*].app[0].packetName = "video"

# ============================================================
# Best Effort stations (AC_BE): saturated UDP at Ethernet MTU
# Payload: 1500 B / 1 ms
#   - 1500 B = max MAC Client Data per IEEE 802.3-2005 Clause 3 (Figure 3-1, "MAC frame format"),
#     derived from maxUntaggedFrameSize=1518 (Table 4.4) minus DA+SA+Length/Type+FCS (18 B).
#   - 802.11 MSDU max is 2304 B (IEEE 802.11-2020 Table 9-25), but Ethernet-bridged
#     payloads are bounded by 1500 B at the wired backhaul.
# QoS class: 3GPP TS 23.501 Table 5.7.4-1 5QI=9 default Non-GBR (Priority 90, PDB 300 ms).
# ============================================================
*.beSta[*].numApps = 1
*.beSta[*].app[0].typename = "UdpBasicApp"
*.beSta[*].app[0].destAddresses = "server"
*.beSta[*].app[0].destPort = 80
*.beSta[*].app[0].messageLength = 1500B
*.beSta[*].app[0].sendInterval = 1ms
*.beSta[*].app[0].startTime = uniform(0s, 0.1s)
*.beSta[*].app[0].packetName = "bestEffort"

# ============================================================
# Background stations (AC_BK): low-rate CBR (custom, no standard prescription for sizes)
# Payload: 512 B / 100 ms
# QoS class: 3GPP TS 23.501 Table 5.7.4-1 5QI=8 Non-GBR background (Priority 80, PDB 300 ms).
# ============================================================
*.bkSta[*].numApps = 1
*.bkSta[*].app[0].typename = "UdpBasicApp"
*.bkSta[*].app[0].destAddresses = "server"
*.bkSta[*].app[0].destPort = 21
*.bkSta[*].app[0].messageLength = 512B
*.bkSta[*].app[0].sendInterval = 100ms
*.bkSta[*].app[0].startTime = uniform(0s, 0.1s)
*.bkSta[*].app[0].packetName = "background"

# ============================================================
# Statistics collection
# ============================================================
**.app[*].**.throughput.result-recording-modes = +vector
**.mac.**.packetSentToPeer*.result-recording-modes = +vector
**.mac.dcf.channelAccess.channelOwnershipChanged.result-recording-modes = +vector
